<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite sheet previewer</title>
<!-- Reference previewer (bnbloc.previewer.contract/v1). Runs in a sandboxed
     opaque-origin frame: no inline script, no network, assets from the
     bundle only. -->
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body>
<canvas id="view" aria-label="Preview canvas"></canvas>
<aside id="frames" hidden>
  <h2 id="frames-title">Frames</h2>
  <ol id="frames-list"></ol>
</aside>
<p id="status" role="status">Waiting for a file…</p>
</body>
</html>
