{{- /*
Workload + Service per bnbloc microservice.

Each entry names the service's port, its values block, whether it reads the
shared database + svcauth key (`db`), the peers it calls (rendered as
BNBLOC_<PEER>_BASE_URL), and its scale-out role (`shard`):

  - "owner": realtime and relay keep per-key state in process memory
    (rooms and member streams; relay pairings). They run as a StatefulSet
    behind a headless Service (bnbloc-<name>-peers). With more than one
    replica (or an HPA) every pod gets BNBLOC_<NAME>_PEERS (the headless
    name, re-resolved to the ready pods) and BNBLOC_<NAME>_SELF (its pod
    IP), owns the keys rendezvous hashing assigns it, and forwards the rest
    to their owner (internal/shard). One replica gets neither: single node.
  - "count": the gateway only needs the live replica count (its rate limits
    enforce 1/N of each budget), read from BNBLOC_GATEWAY_PEERS.

The env each service receives mirrors what its services/<name>/cmd/main.go
reads — see docs/deploy-service-env.md.
*/ -}}
{{- $ports := dict "gateway" 8080 "room" 8080 "activity" 8081 "realtime" 8082 "shareagent" 8083 "relay" 8085 -}}
{{- $services := dict
  "gateway"         (dict "cfg" .Values.gateway         "db" true  "shard" "count" "peers" (list "room" "activity" "realtime" "shareagent" "relay"))
  "room"            (dict "cfg" .Values.room            "db" true  "shard" ""      "peers" (list "realtime"))
  "activity"        (dict "cfg" .Values.activity        "db" true  "shard" ""      "peers" (list "room" "realtime"))
  "realtime"        (dict "cfg" .Values.realtime        "db" true  "shard" "owner" "peers" (list "room"))
  "shareagent"      (dict "cfg" .Values.shareagent      "db" true  "shard" ""      "peers" (list "room"))
  "relay"           (dict "cfg" .Values.relay           "db" false "shard" "owner" "peers" (list))
-}}
{{- range $name, $svc := $services }}
{{- $cfg := $svc.cfg | default dict }}
{{- $port := get $ports $name }}
{{- $owner := eq $svc.shard "owner" }}
{{- /* Scale-out mode: more than one replica, now or through the HPA. */ -}}
{{- $scaled := or (gt (int (default 1 $cfg.replicas)) 1) (and $cfg.hpa $cfg.hpa.enabled) }}
{{- if and (eq $name "realtime") $scaled (not $cfg.attachments.s3.bucket) }}
{{- fail "bnbloc-realtime with more than one replica (or an HPA) needs realtime.attachments.s3.bucket: the disk blob store is one pod's volume, and realtime refuses it when peers are configured" }}
{{- end }}
---
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $owner }}
metadata:
  name: bnbloc-{{ $name }}
  labels: { app.kubernetes.io/name: bnbloc-{{ $name }} }
spec:
  replicas: {{ default 1 $cfg.replicas }}
  {{- if $owner }}
  # The headless Service publishes the ready pods' IPs: the peer set.
  serviceName: bnbloc-{{ $name }}-peers
  # Ownership is by pod IP, not ordinal: start and replace pods in parallel.
  podManagementPolicy: Parallel
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: bnbloc-{{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bnbloc-{{ $name }} }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: bnbloc-{{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.repository }}-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $port }}
            {{- if and (eq $name "gateway") $cfg.metricsPort }}
            - name: metrics
              containerPort: {{ $cfg.metricsPort }}
            {{- end }}
          env:
            - name: BNBLOC_ENV
              value: {{ $.Values.environment | quote }}
            - name: BNBLOC_{{ upper $name }}_LISTEN_ADDR
              value: ":{{ $port }}"
            {{- range $peer := $svc.peers }}
            - name: BNBLOC_{{ upper $peer }}_BASE_URL
              value: "http://bnbloc-{{ $peer }}:{{ get $ports $peer }}"
            {{- end }}
            {{- if and $owner $scaled }}
            # Scale-out by key ownership (internal/shard): the headless name
            # (re-resolved every 5s to the ready pods; peers probed every second) and this pod's own IP.
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: BNBLOC_{{ upper $name }}_PEERS
              value: "bnbloc-{{ $name }}-peers:{{ $port }}"
            - name: BNBLOC_{{ upper $name }}_SELF
              value: "$(POD_IP)"
            {{- end }}
            {{- if eq $svc.shard "count" }}
            # Live replica count for the per-replica share of every rate limit.
            - name: BNBLOC_{{ upper $name }}_PEERS
              value: "bnbloc-{{ $name }}-peers:{{ $port }}"
            {{- end }}
            {{- if $svc.db }}
            - name: BNBLOC_MYSQL_DSN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.mysql.dsnSecretRef.name }}, key: {{ $.Values.mysql.dsnSecretRef.key }} }
            - name: BNBLOC_INTERNAL_KEY
              valueFrom:
                secretKeyRef: { name: {{ $.Values.internalKey.secretRef.name }}, key: {{ $.Values.internalKey.secretRef.key }} }
            {{- with $.Values.awsSecrets }}
            {{- if .secretID }}
            - name: BNBLOC_AWS_SECRET_ID
              value: {{ .secretID | quote }}
            - name: BNBLOC_AWS_REGION
              value: {{ .region | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $name "gateway" }}
            {{- if $cfg.metricsPort }}
            - name: BNBLOC_METRICS_ADDR
              value: ":{{ $cfg.metricsPort }}"
            {{- end }}
            - name: BNBLOC_SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: {{ $.Values.sessionSigning.secretRef.name }}, key: {{ $.Values.sessionSigning.secretRef.key }} }
            - name: BNBLOC_OIDC_ISSUER_URL
              value: {{ $.Values.oidc.issuerURL | quote }}
            - name: BNBLOC_OIDC_CLIENT_ID
              value: {{ $.Values.oidc.clientID | quote }}
            - name: BNBLOC_SUPER_ADMINS
              value: {{ join "," ($cfg.superAdmins | default list) | quote }}
            - name: BNBLOC_ALLOWED_ORIGINS
              value: {{ join "," ($cfg.allowedOrigins | default list) | quote }}
            - name: BNBLOC_TRUSTED_PROXIES
              value: {{ join "," ($cfg.trustedProxies | default list) | quote }}
            - name: BNBLOC_CORES
              value: {{ join "," ($cfg.cores | default list) | quote }}
            {{- with $cfg.localAgentToken }}
            {{- if .secretRef.name }}
            - name: BNBLOC_LOCAL_AGENT_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .secretRef.name }}, key: {{ .secretRef.key }} }
            {{- end }}
            {{- end }}
            {{- with $cfg.secretStoreKey }}
            {{- if .secretRef.name }}
            - name: BNBLOC_SECRET_STORE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .secretRef.name }}, key: {{ .secretRef.key }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and (eq $name "room") $cfg.artifactMaxBytes }}
            - name: BNBLOC_ARTIFACT_MAX_BYTES
              value: {{ $cfg.artifactMaxBytes | quote }}
            {{- end }}
            {{- if eq $name "realtime" }}
            {{- with $cfg.attachments.s3 }}
            {{- if .bucket }}
            - name: BNBLOC_ATTACHMENTS_S3_BUCKET
              value: {{ .bucket | quote }}
            - name: BNBLOC_ATTACHMENTS_S3_REGION
              value: {{ .region | quote }}
            - name: BNBLOC_ATTACHMENTS_S3_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: BNBLOC_ATTACHMENTS_S3_KEY_PREFIX
              value: {{ .keyPrefix | quote }}
            - name: BNBLOC_ATTACHMENTS_S3_PATH_STYLE
              value: {{ .pathStyle | quote }}
            - name: BNBLOC_ATTACHMENTS_S3_DIRECT_DOWNLOADS
              value: {{ .directDownloads | default false | quote }}
            - name: BNBLOC_ATTACHMENTS_S3_PUBLIC_ENDPOINT
              value: {{ .publicEndpoint | default "" | quote }}
            {{- if .credentialsSecretRef.name }}
            - name: BNBLOC_ATTACHMENTS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .credentialsSecretRef.name }}, key: {{ .credentialsSecretRef.accessKeyIDKey }} }
            - name: BNBLOC_ATTACHMENTS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .credentialsSecretRef.name }}, key: {{ .credentialsSecretRef.secretAccessKeyKey }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $name "realtime" }}
            {{- with $cfg.search.opensearch }}
            {{- if .url }}
            - name: BNBLOC_SEARCH_OPENSEARCH_URL
              value: {{ .url | quote }}
            - name: BNBLOC_SEARCH_OPENSEARCH_INDEX_PREFIX
              value: {{ .indexPrefix | default "" | quote }}
            {{- if .username }}
            - name: BNBLOC_SEARCH_OPENSEARCH_USERNAME
              value: {{ .username | quote }}
            - name: BNBLOC_SEARCH_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ required "realtime.search.opensearch.passwordSecretRef.name is required when a username is set" .passwordSecretRef.name }}, key: {{ .passwordSecretRef.key }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or (eq $name "realtime") (eq $name "shareagent") (eq $name "activity") }}
            - name: BNBLOC_PUBLIC_URL
              value: {{ $.Values.publicURL | quote }}
            {{- end }}
            {{- if and (eq $name "realtime") $.Values.webPush.publicKey }}
            - name: BNBLOC_WEB_PUSH_VAPID_PUBLIC_KEY
              value: {{ $.Values.webPush.publicKey | quote }}
            - name: BNBLOC_WEB_PUSH_VAPID_SUBJECT
              value: {{ $.Values.webPush.subject | quote }}
            - name: BNBLOC_WEB_PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: {{ required "webPush.privateKeySecretRef.name is required when webPush.publicKey is set" $.Values.webPush.privateKeySecretRef.name }}, key: {{ $.Values.webPush.privateKeySecretRef.key }} }
            {{- end }}
            {{- if eq $name "relay" }}
            - name: BNBLOC_RELAY_STUN_SERVERS
              value: {{ join "," ($cfg.stunServers | default list) | quote }}
            - name: BNBLOC_RELAY_ENDPOINTS
              value: {{ join "," ($cfg.endpoints | default list) | quote }}
            {{- end }}
            {{- with $cfg.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness never depends on the database (a DB blip must not restart
          # pods); readiness does (/readyz is 503 while the DB is unreachable).
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $port }} }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: {{ $port }} }
            periodSeconds: 10
          resources: {{- toYaml ($cfg.resources | default $.Values.resources) | nindent 12 }}
          {{- if and (eq $name "realtime") (not $cfg.attachments.s3.bucket) }}
          volumeMounts:
            - name: attachments
              mountPath: /var/lib/bnbloc/attachments
          {{- end }}
      {{- if and (eq $name "realtime") (not $cfg.attachments.s3.bucket) }}
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: bnbloc-realtime-attachments
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: bnbloc-{{ $name }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: bnbloc-{{ $name }} }
  ports:
    - name: http
      port: {{ $port }}
      targetPort: {{ $port }}
    {{- if and (eq $name "gateway") $cfg.metricsPort }}
    # In-cluster scraping only; the ingress routes the http port.
    - name: metrics
      port: {{ $cfg.metricsPort }}
      targetPort: {{ $cfg.metricsPort }}
    {{- end }}
{{- if $svc.shard }}
---
# Headless peer Service: its DNS name resolves to every READY pod, which is
# the replica set the service shards over (or counts). Not-ready pods are
# deliberately unpublished: a replica that cannot reach its dependencies owns
# no keys.
apiVersion: v1
kind: Service
metadata:
  name: bnbloc-{{ $name }}-peers
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: { app.kubernetes.io/name: bnbloc-{{ $name }} }
  ports:
    - name: http
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
{{- if and $cfg.hpa $cfg.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bnbloc-{{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ ternary "StatefulSet" "Deployment" $owner }}
    name: bnbloc-{{ $name }}
  minReplicas: {{ $cfg.hpa.minReplicas }}
  maxReplicas: {{ $cfg.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- if not .Values.realtime.attachments.s3.bucket }}
---
# Realtime's disk blob store (attachments + sidecar artifacts), only for a
# single realtime replica (more require S3; the chart fails otherwise).
# ReadWriteOnce is sufficient: the StatefulSet replaces its one pod in place
# (old pod gone before the new one starts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bnbloc-realtime-attachments
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.realtime.attachments.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.realtime.attachments.persistence.size }}
{{- end }}
{{- if .Values.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bnbloc
  {{- with .Values.gateway.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          # Desktop bridge live file sync (WebSocket). The sync token rides the
          # stream in cleartext: serve this host over TLS only.
          - path: /relay
            pathType: Prefix
            backend:
              service:
                name: bnbloc-relay
                port: { number: 8085 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bnbloc-gateway
                port: { number: 8080 }
  {{- if .Values.gateway.ingress.tls }}
  tls:
    - hosts: [{{ .Values.gateway.ingress.host }}]
      secretName: bnbloc-gateway-tls
  {{- end }}
{{- end }}
