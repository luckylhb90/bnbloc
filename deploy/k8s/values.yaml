# bnbloc Helm values. Each service is an independent workload + Service
# (Deployments; realtime and relay are StatefulSets, see below).
#
# Secrets are NOT created by this chart: create the referenced Secrets out of
# band (or with your secrets operator) before installing. Every Go service runs
# with BNBLOC_ENV=production, so a missing DSN / internal key / signing key /
# OIDC setting fails the pod at startup instead of booting in dev mode.
image:
  registry: registry.corp.example
  # Images are <registry>/<repository>-<service>:<tag>, built from the root
  # Dockerfile (or deploy/prod/<service>/Dockerfile).
  repository: bnbloc
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# BNBLOC_ENV for every Go service. Keep "production" for any real cluster.
environment: production

# MySQL DSN shared by every stateful service
# (user:pass@tcp(host:3306)/bnbloc?parseTime=true[&tls=true]).
mysql:
  dsnSecretRef:
    name: bnbloc-mysql
    key: dsn

# Service-to-service identity (svcauth). One value, identical everywhere.
internalKey:
  secretRef:
    name: bnbloc-internal
    key: internalKey

# JWT signing key for bnbloc session tokens (gateway). All gateway replicas
# share it.
sessionSigning:
  secretRef:
    name: bnbloc-session
    key: signingKey

# Seals secrets at rest (BNBLOC_SECRET_STORE_KEY: 32 random bytes, base64 or
# hex, e.g. `openssl rand -base64 32`): components' platform and
# organization settings and endpoint components' credentials (gateway; realtime
# opens notifiers' signing secrets with it) and interactive apps' data keys
# (room). Every replica of all three shares it; losing it loses those settings
# and credentials (admins enter them again, rotate the credentials) and every
# app's data. Unset turns those features off.
secretStoreKey:
  secretRef: { name: "", key: secretStoreKey }

# Optional: load secrets from AWS Secrets Manager instead of / on top of the
# Secrets above (internal/config/aws_secrets.go). Empty = disabled.
awsSecrets:
  secretID: ""
  region: ""

# Enterprise OIDC relying party (gateway). Required in production: the dev
# verifier accepts any identity and is refused when BNBLOC_ENV=production.
oidc:
  issuerURL: ""
  clientID: ""

# Public web origin (BNBLOC_PUBLIC_URL, e.g. https://bnbloc.corp.example):
# member notifications deep-link into rooms on it, and the gateway builds
# every link and artifact URL it hands out on it. Empty = notifications carry
# no link and the gateway uses each request's own origin.
publicURL: ""

# Browser push notifications (N4): the deployment's VAPID key pair, generated
# with `bnbloc keys gen-vapid` (realtime). Empty publicKey = the channel is
# off (the web hides its toggle). The private key comes from a Secret; the
# subject is mailto:<ops address> (empty = publicURL when it is https).
webPush:
  publicKey: ""
  subject: ""
  privateKeySecretRef: { name: "", key: privateKey }

gateway:
  # Replicas share all auth state through the database (signing key, SSO
  # hand-offs, refresh-token families) and reconcile installed components
  # from platform settings every 30s, so an install on one replica reaches
  # the others without a restart and no sticky routing is needed. Rate
  # limits are per replica memory: each enforces 1/N of every budget, N
  # being the live replica count (BNBLOC_GATEWAY_PEERS, the
  # bnbloc-gateway-peers headless Service the chart renders).
  replicas: 2
  # Internal Prometheus listener (BNBLOC_METRICS_ADDR). The public port never
  # serves /metrics; scrape this port in-cluster and never route it from the
  # ingress.
  metricsPort: 9090
  hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
  # Cross-tenant platform admins: verified subject ids or emails.
  superAdmins: []
  # Extra browser origins for CORS (same-origin browser clients need none).
  allowedOrigins: []
  # CIDRs of the ingress controller pods whose X-Forwarded-For is believed
  # for the per-IP limits (BNBLOC_TRUSTED_PROXIES): direct login and the
  # API-token exchange, and public share reads. SSO-only gateways need it too
  # (the API-token exchange and public shares stay reachable). Empty trusts
  # no proxy (every client then shares the controller's bucket).
  trustedProxies: []
  # A separate https origin for sites and their app API
  # (BNBLOC_SITES_ORIGIN, e.g. https://sites.bnbloc-usercontent.example):
  # the gateway then serves sites only there and nothing else there. It
  # needs its own DNS name and TLS certificate (Secret bnbloc-sites-tls);
  # the ingress below adds its host, routed to the gateway. Recommended in
  # production, preferably on a separate registrable domain. Empty = sites
  # are served sandboxed from the public origin.
  sitesOrigin: ""
  # Explicitly configured cores (operator escape hatch; installed component
  # packages need no entry). Each needs BNBLOC_CORE_<NAME>_URL via extraEnv.
  cores: []
  extraEnv: []
  ingress:
    enabled: true
    className: ""
    host: bnbloc.corp.example
    tls: true
    # The SPA/API and the relay share this host: / -> gateway, /relay -> relay.
    # Requirements the controller must meet (ingress-nginx annotations shown):
    # 256 MiB bodies for POST /v1/platform/artifacts and blob artifact
    # versions (POST /v1/rooms/*/artifacts/*/versions), no response buffering
    # (room events are SSE), and long read timeouts for SSE/WebSocket.
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "256m"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"

room:
  replicas: 2
  # Max bytes of one blob artifact version (BNBLOC_ARTIFACT_MAX_BYTES).
  # Empty = 100 MiB; at most 256 MiB (realtime's blob cap). Raise the
  # ingress proxy-body-size with it.
  artifactMaxBytes: ""

activity:  { replicas: 2, hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 } }
shareagent: { replicas: 2 }

# realtime has no owners (docs/prd/2026-10-30-replicas-without-owners.md):
# any pod serves any room and member, so it is a Deployment behind the
# bnbloc-realtime Service and can autoscale. With replicas > 1 (or an HPA)
# the pods share a bus, a Redis (bus.redisURLSecretRef, or
# BNBLOC_REALTIME_BUS_REDIS_URL in the AWS Secrets Manager secret): a room's
# events reach every pod streaming it, and a pod going away reconnects only
# its own streams. More than one replica also requires the S3 blob store
# (the chart fails otherwise). docs/production-deployment.md#high-availability.
realtime:
  replicas: 1
  hpa: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  bus:
    # Redis URL of the bus (redis://[user:password@]host:6379/1); its own
    # database number keeps it apart from Pulse's keys on a shared Redis.
    redisURLSecretRef: { name: "", key: redisURL }
    # Redis Cluster (cluster mode enabled; BNBLOC_REALTIME_BUS_REDIS_CLUSTER):
    # the URL then names a node or the configuration endpoint, and only
    # database 0 exists, so leave the number off.
    redisCluster: false
  attachments:
    # S3 (or S3-compatible) blob store for attachments + sidecar artifacts.
    # Empty bucket = local disk on the PVC below.
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      keyPrefix: ""
      pathStyle: false
      # Downloads answer 302 to a 5-minute presigned URL (S3 only) instead
      # of streaming through bnbloc. publicEndpoint = the S3 base URL
      # clients reach when endpoint is cluster-internal (empty = endpoint).
      directDownloads: false
      publicEndpoint: ""
      # Optional static credentials; empty name = AWS default credential
      # chain (e.g. IRSA / pod identity).
      credentialsSecretRef: { name: "", accessKeyIDKey: accessKeyID, secretAccessKeyKey: secretAccessKey }
    persistence:
      size: 20Gi
      storageClass: ""
  # Message search backend. Empty url = MySQL FULLTEXT (ngram), nothing to
  # run. An OpenSearch url (e.g. https://search.corp.example:9200) moves
  # global search to that cluster: realtime probes it at startup and the pod
  # fails while the cluster is unreachable, refuses the credentials, or the
  # index can be neither found nor created. Fill a new index with
  # `bnbloc search reindex`. Shard/replica counts come from the cluster (or
  # an index template for <indexPrefix>-*). docs/production-deployment.md#search-backend.
  search:
    opensearch:
      url: ""
      # Index name prefix: <indexPrefix>-room-messages-v<N>. Empty = bnbloc.
      indexPrefix: ""
      # Optional HTTP basic credentials; empty username = none.
      username: ""
      passwordSecretRef: { name: "", key: password }
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "2", memory: "1Gi" }

# relay scales out by KEY OWNERSHIP (internal/shard): a P2P sync session's
# two peers must meet on one pod, so each session key is owned by one pod
# (a StatefulSet behind a headless bnbloc-relay-peers Service; with
# replicas > 1 each pod gets BNBLOC_RELAY_PEERS/_SELF) and any pod forwards
# a request one hop to the owner.
relay:
  replicas: 1
  hpa: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }

# The organization board (bnbloc-pulse, docs/prd/2026-10-24-executive-pulse-backend.md).
# Off until enabled: the board then answers "not deployed" and the emitting
# services (activity, room, realtime) stay silent. Enabling it needs a Redis for
# the stream and the member digest key. Either put them in the AWS Secrets Manager
# secret (awsSecrets.secretID) as BNBLOC_PULSE_REDIS_URL and BNBLOC_PULSE_KEY, or
# name Secrets below; an empty ref leaves the variable to the secret.
pulse:
  enabled: false
  # Redis URL of the board's stream and live state (redis://[user:password@]host:6379/0).
  redisURLSecretRef: { name: "", key: redisURL }
  # Redis Cluster (BNBLOC_PULSE_REDIS_CLUSTER=true): set when the Redis is cluster-mode
  # (a MOVED error on the snapshot is the sign of the single-node client against it).
  redisCluster: false
  # Member digest key (BNBLOC_PULSE_KEY, at least 32 bytes), shared by realtime and
  # room. Keep it stable: changing it resets the active-people count. Empty name =
  # presence events off.
  keySecretRef: { name: "", key: pulseKey }
  # One consumer per deployment: keep at 1 (no HPA).
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }

resources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits:   { cpu: "500m", memory: "512Mi" }

# Nightly in-cluster smoke (templates/smoke-cronjob.yaml): a CronJob runs
# `bnbloc smoke --alert-on-failure` from the CLI image
# (<registry>/<repository>-cli:<tag>, built with SERVICE=cli or
# deploy/prod/cli/Dockerfile). A failed run alerts the platform admins through
# the installed notifier components and leaves a failed Job. The API token is
# a super-admin-issued token (`bnbloc api-tokens create --subject svc:smoke`;
# list the subject in gateway.superAdmins so it may send the alert), stored in
# a Secret created out of band. See docs/production-deployment.md#nightly-smoke.
smoke:
  enabled: false
  # Cron schedule, evaluated in timeZone (an IANA name, e.g. Europe/Berlin);
  # empty timeZone = the controller's zone (UTC on most clusters).
  schedule: "41 2 * * *"
  timeZone: ""
  # Gateway the smoke drives. Empty = the in-cluster Service
  # (http://bnbloc-gateway:8080); set the public https URL to also cover the
  # ingress (TLS, SSE buffering, timeouts).
  gatewayURL: ""
  # Also wait for this agent's reply (--agent: provider, core/provider or
  # target id). The token's subject must own the agent and its bridge must be
  # online. Empty = message path only.
  agent: ""
  # Alert recipients (member ids); empty = every BNBLOC_SUPER_ADMINS entry.
  alertTo: []
  # Extra `bnbloc smoke` flags, e.g. ["--timeout", "180s"].
  extraArgs: []
  apiTokenSecretRef: { name: "", key: apiToken }
  # Upper bound of one run (the agent reply wait is --timeout, default 120s).
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: "10m", memory: "32Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }
