# bnbloc web tier — static SPA host.
#
# Serves ONLY the built SPA (HTML/JS/CSS). It does not reverse-proxy the API or
# the relay: in the deployment, the front nginx / ALB in front of this container
# owns path routing (/v1, /api, /sso -> gateway; /relay -> relay). Keeping this
# container to a single job — static hosting with SPA fallback — avoids a second
# copy of the routing rules that would drift from the front proxy.
#
# The SPA addresses the backend over same-origin paths, so the front proxy must
# serve this container and the backend services under one host.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe. An exact-match location so it never falls through to the
    # SPA fallback; returns a fixed 200 without touching the filesystem, matching
    # the backend services' GET /healthz. Never cached.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths return index.html so client routing
    # works. index.html itself must not be cached, or a deploy serves stale
    # asset references.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
