# High-availability overlay for the dev stack: every service that can run more
# than once does, so a replica can be stopped or killed while load runs
# (docs/load-testing.md "Failover"). Not a production layout: production is the
# Helm chart (docs/production-deployment.md#high-availability).
#
#   docker compose -f compose.yml -f compose.ha.yml up -d --build
#   docker stop <one realtime container>      # a drain (SIGTERM)
#   docker kill <one realtime container>      # a crash
#
# Replicas need nothing but the replicas' Redis (BNBLOC_REDIS_URL; the
# stack's, its own database number): realtime shares rooms' events through
# it, relay pairs a session's halves across replicas. More than one realtime
# replica needs one blob store for all: here the attachments volume every
# replica mounts (in production S3, or an NFS/EFS mount).
services:
  realtime:
    deploy: { replicas: 3 }
    environment:
      BNBLOC_ATTACHMENTS_DIR_SHARED: "true"
      BNBLOC_REDIS_URL: "redis://redis:6379/1"

  relay:
    deploy: { replicas: 2 }
    environment:
      BNBLOC_REDIS_URL: "redis://redis:6379/1"

  room:
    deploy: { replicas: 2 }

  activity:
    deploy: { replicas: 2 }

  shareagent:
    deploy: { replicas: 2 }
